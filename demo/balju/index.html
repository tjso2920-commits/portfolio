<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발주 Faster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:#eceef1; color:#111;
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;}
  button{font-family:inherit; cursor:pointer;}
  .hide{display:none !important;}
  .btn{background:#fff; color:#111; border:1px solid #c7ccd4; border-radius:9px; padding:8px 11px; font-size:13px; font-weight:700;}
  .btn:active{transform:translateY(1px);}
  .btn.acc{background:#2f6fe0; border-color:#2f6fe0; color:#fff;}
  .btn.ok{background:#1fa85a; border-color:#1fa85a; color:#fff;}
  .btn.warn{background:#fff; border-color:#e04747; color:#e04747;}
  .btn.sm{padding:6px 9px; font-size:12px;}
  .ghost{background:transparent; border-color:transparent;}

  /* 홈 */
  #home{padding:40px 16px 52px; max-width:560px; margin:0 auto;}
  .hero{text-align:center; margin:6px 0 30px;}
  .brand{font-size:46px; line-height:1; font-weight:900; letter-spacing:-1.5px; margin:0; color:#111;}
  .brand small{font-size:46px; font-weight:900; color:#2f6fe0; letter-spacing:-1px; margin-left:8px;}
  .brand-rule{width:56px; height:5px; border-radius:3px; background:#2f6fe0; margin:18px auto 0;}
  .brand-sub{color:#7a828e; font-size:14px; margin:14px 0 0; font-weight:600;}
  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .tile{background:#fff; border:1px solid #c7ccd4; border-radius:16px; padding:20px 16px; text-align:left; color:#111;}
  .tile .em{font-size:30px; margin-bottom:8px;}
  .tile .nm{font-size:19px; font-weight:900;}
  .tile .ds{color:#778; font-size:12px; margin-top:4px;}
  .sashimi-tile{position:relative; display:flex; flex-direction:column; min-height:151px;}
  .sashimi-main{display:block; color:inherit; text-decoration:none; border-radius:10px; flex:1;}
  .sashimi-main:active{transform:translateY(1px);}
  .fish-icon svg{display:block; width:34px; height:34px;}
  .sashimi-read{position:absolute; top:14px; right:12px; border:1px solid #e04747; border-radius:16px; background:#fff4f4; color:#c82f2f; padding:6px 9px; font-size:11px; line-height:1; font-weight:900;}
  .sashimi-read:active{transform:translateY(1px);}
  .sashimi-notice{line-height:1.75; color:#222; font-size:15px;}
  .sashimi-notice p{margin:0 0 14px;}
  .sashimi-notice p:last-child{margin-bottom:0;}
  .sashimi-notice .deadline{background:#fff4f4; border-left:4px solid #e04747; border-radius:8px; padding:12px 13px;}
  .addvendor{border-style:dashed; color:#889; background:transparent; display:flex; align-items:center; justify-content:center; font-weight:800;}

  /* 시트 chrome */
  .topbar{position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid #d5d9e0; padding:9px 10px; display:flex; align-items:center; gap:8px;}
  .topbar h1{font-size:19px; margin:0; font-weight:900; font-family:"Nanum Myeongjo",serif; color:#2f6fe0; letter-spacing:-0.2px;}
  .topbar .spacer{flex:1;}
  .tabs{display:flex; gap:6px; overflow-x:auto; padding:9px 10px; background:#f4f5f7; border-bottom:1px solid #d5d9e0; position:sticky; top:51px; z-index:19;}
  .tab{white-space:nowrap; background:#fff; border:1px solid #c7ccd4; color:#556; padding:7px 15px; border-radius:20px; font-size:14px; font-weight:800;}
  .tab.on{background:#2f6fe0; border-color:#2f6fe0; color:#fff;}
  .ftabs{display:flex; gap:6px; overflow-x:auto; padding:8px 10px; background:#eef0f3; border-bottom:1px solid #d5d9e0; position:sticky; top:102px; z-index:19;}
  .ftab{white-space:nowrap; background:#fff; border:1px solid #c7ccd4; color:#556; padding:7px 13px; border-radius:10px; font-size:13px; font-weight:800;}
  .ftab.on{background:#111; border-color:#111; color:#fff;}
  .toolbar{display:flex; flex-wrap:wrap; gap:7px; padding:9px 10px; align-items:center; background:#f9fafb; border-bottom:1px solid #d5d9e0; position:sticky; top:151px; z-index:18;}
  .toolbar .date{background:#fff; border:1px solid #c7ccd4; border-radius:8px; padding:7px 9px; font-size:13px;}
  .toolbar .storename{background:#fff; border:1px solid #2f6fe0; border-radius:8px; padding:7px 9px; font-size:14px; font-weight:800; width:110px;}
  .hint{color:#667; font-size:12px; padding:7px 12px 0;}

  /* ====== 종이폼 (원본 복제) ====== */
  .scroll{overflow:auto; padding:12px; -webkit-overflow-scrolling:touch;}
  .paper{width:1056px; background:#fff; color:#000; padding:20px 18px 26px; border:1px solid #ccc;}
  .paperhead{display:flex; align-items:baseline; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:14px;}
  .paperhead .t{font-size:22px; font-weight:900;}
  .paperhead .s{font-size:21px; font-weight:900; color:#b00020; margin-left:12px;}
  .paperhead .sp{flex:1;}
  .paperhead .d{font-size:15px; color:#333; font-weight:700;}
  .cols{display:flex; gap:16px; align-items:flex-start;}
  .col{width:242px; display:flex; flex-direction:column; gap:14px;}
  table.g{width:100%; border-collapse:collapse; table-layout:fixed;}
  table.g td{border:1px solid #000; height:32px; font-size:15px; vertical-align:middle;}
  td.nm{padding:0 8px; white-space:nowrap; overflow:hidden;}
  td.qt{width:58px; padding:0;}
  td.qt .qi{width:100%; height:30px; border:0; text-align:center; font-size:16px; font-weight:800; background:transparent; color:#000; padding:0;}
  td.qt .qi:focus{outline:none; background:#fff7cc;}
  .qv{text-align:center; font-size:16px; font-weight:800; min-height:30px; line-height:30px;}
  td.dl{width:30px; padding:0; text-align:center; color:#e04747; font-weight:900; font-size:15px; cursor:pointer;}
  td.nm input{width:100%; border:1px solid #bbb; border-radius:5px; font-size:14px; padding:4px 5px;}
  .gtools{display:flex; gap:5px; margin-top:4px;}
  .gtools button{flex:1; border:1px dashed #bbb; background:#fafafa; border-radius:6px; padding:6px; font-size:11px; font-weight:700; color:#556;}
  .colbtn{border:1px dashed #bbb; background:transparent; border-radius:8px; padding:8px; font-size:12px; font-weight:700; color:#667; margin-top:2px;}

  /* 달력 */
  .cal{padding:12px; max-width:520px; margin:0 auto;}
  .calhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .calhead b{font-size:17px;}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:5px;}
  .dow span{text-align:center; font-size:11px; color:#889;}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cald{aspect-ratio:1; background:#fff; border:1px solid #d5d9e0; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:13px;}
  .cald.mut{opacity:.25;}
  .cald.has{border-color:#1fa85a; cursor:pointer;}
  .cald.today{outline:2px solid #2f6fe0;}
  .cald .dot{width:6px; height:6px; border-radius:50%; background:#1fa85a; margin-top:3px;}
  .cald .cnt{font-size:9px; color:#1fa85a; margin-top:1px;}

  /* 기능 패널 (사용방법·찾기·음성·서버화) */
  .panel{max-width:640px; margin:0 auto; padding:16px 16px 70px;}
  .panel h2{font-size:20px; margin:2px 0 4px;}
  .panel p{color:#333; font-size:14px; line-height:1.7; margin:8px 0;}
  .panel .step{display:flex; gap:12px; align-items:flex-start; background:#fff; border:1px solid #dfe3ea; border-radius:12px; padding:14px; margin:10px 0;}
  .panel .step .n{flex:none; width:28px; height:28px; border-radius:50%; background:#2f6fe0; color:#fff; font-weight:900; display:flex; align-items:center; justify-content:center; font-size:14px;}
  .panel .step b{font-size:15px;}
  .panel .step small{display:block; color:#778; font-size:13px; margin-top:3px; line-height:1.6;}
  .panel .box{background:#fff; border:1px solid #dfe3ea; border-radius:12px; padding:14px 16px; margin:12px 0;}
  .panel .box h3{margin:0 0 6px; font-size:15px;}
  .panel code{background:#eef1f5; border-radius:5px; padding:1px 6px; font-size:13px; font-family:ui-monospace,Menlo,Consolas,monospace;}
  .findbar{display:flex; gap:8px; margin-bottom:12px;}
  .findbar input{flex:1; background:#fff; border:1px solid #c7ccd4; border-radius:11px; padding:13px 14px; font-size:16px;}
  .findlist{display:flex; flex-direction:column; gap:8px;}
  .findrow{display:flex; justify-content:space-between; align-items:center; gap:10px; background:#fff; border:1px solid #dfe3ea; border-radius:11px; padding:13px 14px; font-size:15px; font-weight:700; text-align:left; width:100%; color:#111;}
  .findrow:active{transform:translateY(1px);}
  .findrow .go{flex:none; color:#2f6fe0; font-weight:800; font-size:13px;}
  .voicewrap{text-align:center; padding:16px 0;}
  .micbig{width:150px; height:150px; border-radius:50%; border:none; background:#2f6fe0; color:#fff; font-size:18px; font-weight:900; box-shadow:0 8px 26px rgba(47,111,224,.35); margin:12px auto 6px; white-space:pre-line; line-height:1.3;}
  .micbig:active{transform:translateY(1px);}
  .micbig.on{background:#e04747; animation:pulse 1s infinite;}
  .voicewrap .status{font-size:15px; font-weight:800; margin-top:16px; min-height:22px;}
  .voicewrap .last{color:#1fa85a; font-weight:800; margin-top:6px; min-height:20px;}
  tr.flash td{background:#fff3b0 !important; transition:background .4s;}

  /* 드래그해도 보이는 매장 라벨 (가로 스크롤에 고정) */
  .nowpin{display:none !important;}

  /* 거래처 B(텍스트 발주) */
  .tvbody{max-width:640px; margin:0 auto; padding:12px 12px 90px;}
  .tvbar{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .tvcount{color:#2f6fe0; font-weight:800; font-size:13px;}
  .tvlist{display:flex; flex-direction:column; gap:8px;}
  .tvrow{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #dfe3ea; border-radius:11px; padding:13px 14px; font-size:16px; font-weight:700; color:#111; cursor:pointer;}
  .tvrow.on{border-color:#1fa85a; background:#f2fbf6;}
  .tvrow:active{transform:translateY(1px);}
  .tvrow .ck{flex:none; width:24px; height:24px; border-radius:6px; border:2px solid #c7ccd4; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:14px;}
  .tvrow.on .ck{border-color:#1fa85a; background:#1fa85a;}
  .tvrow .tnm{flex:1;}
  .tvrow .tvqty{flex:none; width:84px; border:1px solid #c7ccd4; border-radius:8px; padding:8px 6px; font-size:15px; font-weight:800; text-align:center; color:#111; background:#fff;}
  .tvrow .tvqty:focus{outline:none; border-color:#2f6fe0; background:#f2f7ff;}
  .tvadd{display:flex; gap:8px; margin-top:10px;}
  .tvadd input{flex:1; background:#fff; border:1px dashed #9aa3af; border-radius:10px; padding:12px 14px; font-size:15px;}
  .tvtpl{width:100%; min-height:120px; border:1px solid #c7ccd4; border-radius:8px; padding:10px 12px; font-size:14px; line-height:1.6; font-family:inherit; resize:vertical;}
  .tvrow.edit{cursor:default;}
  .tvrow .tvname{flex:1; border:1px solid #bbb; border-radius:6px; padding:8px; font-size:16px; font-weight:600; -webkit-appearance:none;}
  .tvrow .mini{flex:none; width:38px; height:38px; border-radius:8px; border:1px solid #c7ccd4; background:#f4f5f7; font-size:16px; font-weight:800;}
  .tvrow .mini.del{color:#e04747; border-color:#f0b6b6;}
  .tvrow .mini.hlon{background:#ffe23d; border-color:#e6c700; color:#5a4b00;}
  .tvrow .mini.hlbtn{min-width:56px; font-size:13px; font-weight:800; padding:0 8px;}
  .boardaddbar{display:flex; gap:8px; align-items:stretch;}
  .boardaddbar .tvname{flex:1; font-size:16px; padding:10px 12px; border:1px solid #c7ccd4; border-radius:10px; -webkit-appearance:none; background:#fff; color:#111;}
  .boardaddbar .boardaddbtn{white-space:nowrap; min-width:82px; font-size:16px; font-weight:800;}
  .boardpreview{margin-top:16px; background:#fff; border:1px solid #dfe3ea; border-radius:12px; padding:14px;}
  .boardpreview .pvlabel{font-size:12px; font-weight:800; color:#889; margin-bottom:8px;}
  #boardCanvas{width:100%; max-width:340px; height:auto; display:block; margin:0 auto; border:1px solid #e3e6ea; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.1);}
  .tvpreview{margin-top:16px; background:#fff; border:1px solid #dfe3ea; border-radius:12px; padding:14px;}
  .tvpreview .pvlabel{font-size:12px; font-weight:800; color:#889; margin-bottom:6px;}
  .tvpreview pre{white-space:pre-wrap; word-break:break-word; font-family:inherit; font-size:15px; line-height:1.6; background:#f7f8fa; border:1px solid #eceef1; border-radius:8px; padding:12px; margin:0 0 12px;}

  .modal{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:14px; overflow:auto;}
  .card{background:#fff; border-radius:14px; padding:14px; max-width:560px; width:100%; margin-top:10px;}
  .card h3{margin:0 0 10px; font-size:16px;}
  .card img{width:100%; border:1px solid #ddd; border-radius:8px;}
  .mrow{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#000d; color:#fff; padding:11px 16px; border-radius:12px; z-index:99; font-size:14px; font-weight:800; opacity:0; transition:.25s; max-width:min(92vw,420px); width:max-content; text-align:center; line-height:1.5; word-break:keep-all;}
  .toast.on{opacity:1;}

  #caphold{position:fixed; left:-100000px; top:0; z-index:-1;}
  .fab{position:fixed; right:16px; bottom:20px; z-index:40; background:#2f6fe0; color:#fff; border:none; border-radius:26px; padding:13px 18px; font-size:14px; font-weight:800; box-shadow:0 4px 16px rgba(0,0,0,.28);}
  .fab.on{background:#e04747;}
  .fab2{bottom:74px; background:#7b3fe0;}
  .fab2.on{background:#e04747;}
  .fabhelp{position:fixed; right:16px; bottom:128px; z-index:40; background:#fff; color:#556; border:1px solid #d3d8e0; border-radius:20px; padding:8px 14px; font-size:12px; font-weight:800; box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .inappbar{position:fixed; top:0; left:0; right:0; z-index:60; background:#b3261e; color:#fff; padding:10px 12px; font-size:13px; font-weight:700; display:flex; gap:8px; align-items:center; flex-wrap:wrap; box-shadow:0 2px 10px rgba(0,0,0,.35);}
  .inappbar button{background:#fff; color:#b3261e; border:none; border-radius:8px; padding:8px 12px; font-weight:800; font-size:13px;}
  .inappbar .x{margin-left:auto; background:transparent; color:#fff; font-size:17px; padding:4px 8px;}
  .fab.on{background:#e04747; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .bigshare{flex:1; font-size:16px; padding:14px;}
</style>
</head>
<body>

<div id="home">
  <div class="hero">
    <h1 class="brand">발주<small>Faster</small></h1>
    <div class="brand-rule"></div>
    <div class="brand-sub">발주처를 선택해 시작하세요</div>
  </div>
  <div class="tiles" id="tiles"></div>
</div>

<div id="sheet" class="hide">
  <div class="topbar">
    <button class="btn ghost sm" onclick="goHome()">← 홈</button>
    <h1 id="vendorTitle">거래처 A 발주서</h1>
    <div class="spacer"></div>
    <button class="btn sm" id="editBtn" onclick="toggleEdit()">✎ 편집</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="ftabs" id="ftabs"></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="hint" id="hint"></div>
  <div class="scroll" id="scroll"><div class="nowpin" id="nowpin"></div><div id="paperMount"></div></div>
  <div class="panel hide" id="panel"></div>
</div>

<div id="textsheet" class="hide">
  <div class="topbar">
    <button class="btn ghost sm" onclick="goHome()">← 홈</button>
    <h1 id="tvTitle">거래처 B 발주</h1>
    <div class="spacer"></div>
    <button class="btn sm" id="tvEdit" onclick="toggleTvEdit()">✎ 편집</button>
  </div>
  <div class="tabs" id="tvStores"></div>
  <div class="tvbody" id="tvBody"></div>
</div>

<div id="boardsheet" class="hide">
  <div class="topbar">
    <button class="btn ghost sm" onclick="goHome()">← 홈</button>
    <h1 id="boardTitle">손글씨 발주판</h1>
    <div class="spacer"></div>
    <button class="btn sm" onclick="openCommonItemsModal()">🎯 자주품목</button>
  </div>
  <div class="tabs" id="boardStores"></div>
  <div class="tvbody" id="boardBody"></div>
</div>

<div id="voicefabs" class="hide">
  <button id="aiBtn" class="fab fab2" onclick="toggleAIVoice()">🤖 AI</button>
  <button id="micBtn" class="fab" onclick="toggleVoice()">🎤 음성</button>
  <button id="voiceHelpBtn" class="fabhelp" onclick="openVoiceHelp()">❓ 음성 사용법</button>
</div>

<div id="caphold"></div>
<div class="toast" id="toast"></div>

function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('on');
  const dur=Math.min(5200, Math.max(1700, m.length*70));
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('on'),dur);
}
function todayStr(){const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const DOW=['일','월','화','수','목','금','토'];
function fmtDate(ds){if(!ds)return''; const p=ds.split('-').map(Number); const dt=new Date(p[0],p[1]-1,p[2]); return ds+' ('+DOW[dt.getDay()]+')';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

/* ===== 음성 입력 ===== */
let recog=null, listening=false, voiceBuf="";
function allItems(){const r=[]; S().template.forEach(c=>c.forEach(g=>g.items.forEach(it=>r.push(it)))); return r;}

/* --- 표기 정규화(매칭용): 띄어쓰기 제거 + 흔한 표기 흔들림 통일 --- */
function normMatch(s){
  return (s||"").toLowerCase().replace(/\s+/g,"")
    .replace(/꼬/g,"코").replace(/야끼/g,"야키").replace(/빠/g,"바").replace(/뿌/g,"부")
    .replace(/[·.,!?~]/g,"");
}
/* --- 한국어 수사 → 숫자 --- */
function parseLeadingNum(s){
  let m=s.match(/^\d+(?:\.\d+)?/); if(m) return {num:m[0], len:m[0].length};
  const TENS={열:10,스물:20,스무:20,서른:30,마흔:40,쉰:50,예순:60,일흔:70,여든:80,아흔:90};
  const ONES={하나:1,한:1,둘:2,두:2,셋:3,세:3,석:3,서:3,넷:4,네:4,너:4,넉:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9};
  let i=0,val=0,hit=false;
  for(const k of Object.keys(TENS).sort((a,b)=>b.length-a.length)){ if(s.startsWith(k,i)){val+=TENS[k];i+=k.length;hit=true;break;} }
  for(const k of Object.keys(ONES).sort((a,b)=>b.length-a.length)){ if(s.startsWith(k,i)){val+=ONES[k];i+=k.length;hit=true;break;} }
  if(hit) return {num:String(val), len:i};
  // 한자어(삼백, 천오백, 이천, 이만…)
  const D={영:0,공:0,일:1,이:2,삼:3,사:4,오:5,육:6,륙:6,칠:7,팔:8,구:9}, U={십:10,백:100,천:1000};
  let j=0,total=0,section=0,cur=0,any=false;
  while(j<s.length){const ch=s[j];
    if(ch in D){cur=D[ch];j++;any=true;}
    else if(ch in U){section+=(cur||1)*U[ch];cur=0;j++;any=true;}
    else if(ch==="만"){total+=(section+cur)*10000;section=0;cur=0;j++;any=true;}
    else break;}
  if(any){total+=section+cur; return {num:String(total), len:j};}
  return null;
}
/* --- 단위 말 → 기호 --- */
const UNIT_MAP=[["킬로그램","kg"],["킬로그람","kg"],["키로그램","kg"],["킬로","kg"],["키로","kg"],["케이지","kg"],["kg","kg"],
  ["그램","g"],["그람","g"],["g","g"],["리터","L"],["밀리리터","ml"],["밀리","ml"],["ml","ml"],["cc","cc"],
  ["박스","박스"],["빡스","박스"],["상자","박스"],["봉지","봉"],["봉","봉"],["팩","팩"],["단","단"],["망","망"],
  ["판","판"],["근","근"],["포","포"],["통","통"],["병","병"],["캔","캔"],["말","말"],["되","되"],["마리","마리"],
  ["개","개"],["알","알"],["장","장"],["줄","줄"],["컵","컵"],["자루","자루"],["묶음","묶음"],["세트","세트"]]
  .sort((a,b)=>b[0].length-a[0].length);
/* --- 수량 문자열 정규화: "한박스"→"1박스", "삼백그램"→"300g" --- */
function normalizeQty(raw){
  let s=(raw||"").replace(/\s+/g,"").trim(); if(!s) return "1";
  let numStr="", rest=s;
  const n=parseLeadingNum(s); if(n){numStr=n.num; rest=s.slice(n.len);}
  let unit="";
  for(const [k,v] of UNIT_MAP){ if(rest.startsWith(k)){unit=v; rest=rest.slice(k.length); break;} }
  if(!unit){ for(const [k,v] of UNIT_MAP){ if(rest.includes(k)){unit=v; break;} } }
  if(numStr&&unit) return numStr+unit;
  if(numStr) return numStr+(rest.replace(/^\s+/,"")||"");
  if(unit) return "1"+unit;
  return s;
}
/* --- 편집거리(유사매칭 fallback용) --- */
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];}

function applyVoice(transcript){
  if(inBoardMode()){
    const line=boardNormalizeSpoken(transcript);
    if(!line){ toast('❓ "'+transcript+'" 다시 말해줘'); return; }
    const a=boardAddSpokenLines([line]); toast("✅ "+a.join(", ")); return;
  }
  const text=normMatch(transcript);
  const names=allItems().map(it=>({it,name:normMatch(it.name)})).filter(x=>x.name).sort((a,b)=>b.name.length-a.name.length);
  let matches=[];
  names.forEach(({it,name})=>{let idx=text.indexOf(name); while(idx>-1){matches.push({it,name,start:idx,end:idx+name.length}); idx=text.indexOf(name,idx+1);}});
  matches.sort((a,b)=> a.start-b.start || b.name.length-a.name.length);
  const chosen=[]; let lastEnd=-1;
  for(const m of matches){ if(m.start>=lastEnd){ chosen.push(m); lastEnd=m.end; } }

  if(!chosen.length){
    // 유사매칭 fallback: 숫자/단위 제거한 앞부분을 가장 가까운 품목에 붙임
    let core=text; const nn=parseLeadingNum(core); // 혹시 "숙주3" 형태
    let best=null;
    names.forEach(({it,name})=>{ for(let w=Math.max(1,name.length-1); w<=name.length+1; w++){
      for(let s=0;s+w<=core.length;s++){ const win=core.slice(s,s+w); const d=lev(win,name);
        if(!best||d<best.d||(d===best.d && w>(best.e-best.s))){best={it,name,d,s,e:s+w};} } } });
    if(best && best.d<=Math.max(1,Math.ceil(best.name.length*0.34))){
      const q=normalizeQty(core.slice(0,best.s)+core.slice(best.e));
      S().draft[best.it.id]=q; saveDB(); if(viewMode==="form") renderForm();
      toast("✅ (유사) "+best.it.name+" "+q); return;
    }
    toast('❓ "'+transcript+'" 품목 못찾음'); return;
  }
  const applied=[];
  for(let i=0;i<chosen.length;i++){
    const c=chosen[i], next=chosen[i+1];
    let qty=text.slice(c.end, next?next.start:text.length);
    qty=normalizeQty(qty);
    S().draft[c.it.id]=qty; applied.push(c.it.name+" "+qty);
  }
  saveDB(); if(viewMode==="form") renderForm();
  toast("✅ "+applied.join(", "));
}
function setMic(on){const b=$('#micBtn'); if(b){b.classList.toggle('on',on); b.textContent=on?"🎤 듣는중…":"🎤 음성";}}
async function toggleVoice(){
  if(inApp() && !listening){ showInAppBanner(); toast("카톡 안에서는 음성이 막혀요. 위 '"+recommendedBrowser()+"로 열기' 버튼을 눌러줘"); return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    if(geminiKey()){ toast("이 브라우저는 무료음성 미지원 → 🤖 AI로 인식할게"); return toggleAIVoice(); }
    toast("이 브라우저는 무료음성 미지원 → 🤖 AI 키 넣고 AI 버튼 써줘"); return;
  }
  if(listening){ listening=false; try{recog.stop();}catch(_){}; setMic(false); toast("음성 종료"); return; }
  if(!window.isSecureContext){ toast("⚠ https 주소에서만 마이크 사용 가능 (네트리파이 주소로 열어줘)"); return; }
  // 브라우저 '마이크 허용/차단' 팝업을 명시적으로 띄운다
  try{
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      const s=await navigator.mediaDevices.getUserMedia({audio:true});
      s.getTracks().forEach(t=>t.stop());
    }
  }catch(e){ toast("마이크를 '허용'해야 음성인식이 돼요"); setMic(false); return; }
  if(!recog){
    recog=new SR(); recog.lang="ko-KR"; recog.continuous=false; recog.interimResults=true; recog.maxAlternatives=5;
    recog.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++){ const res=e.results[i];
      if(res.isFinal){ let picked=res[0].transcript;
        for(let a=0;a<res.length;a++){ const t=normMatch(res[a].transcript);
          if(allItems().some(it=>t.includes(normMatch(it.name)))){ picked=res[a].transcript; break; } }
        applyVoice(picked); voiceBuf="";
      } else { voiceBuf=res[0].transcript; }
    } };
    recog.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){toast("마이크가 차단돼 있어요. 주소창 왼쪽 자물쇠 → 마이크 '허용'으로 바꿔줘"); listening=false; setMic(false);} };
    recog.onend=()=>{ if(voiceBuf){ applyVoice(voiceBuf); voiceBuf=""; } if(listening){ try{recog.start();}catch(_){}} else setMic(false); };
  }
  listening=true; try{recog.start();}catch(_){}; setMic(true); toast('🎤 듣는 중… 예: "숙주 한 박스"');
}

/* ===== AI 음성(Gemini 오디오) ===== */
let mediaRec=null, aChunks=[], aiRecording=false, aiAutoStopTimer=null;
function setAI(on,label){const b=$('#aiBtn'); if(b){b.classList.toggle('on',on); b.textContent=label||(on?"🔴 녹음중":"🤖 AI");}}
async function toggleAIVoice(){
  if(typeof DEMO_MODE!=="undefined" && DEMO_MODE) return demoAIVoice();
  if(!geminiKey()){ toast("먼저 AI 키를 넣어줘 (사용방법 → AI 음성 키 설정)"); setGeminiKey(); return; }
  if(aiRecording){ clearTimeout(aiAutoStopTimer); try{mediaRec.stop();}catch(_){} return; }
  if(inApp()){ showInAppBanner(); toast("카톡 안에서는 녹음이 막혀요. 위 '"+recommendedBrowser()+"로 열기' 버튼을 눌러줘"); return; }
  if(!window.isSecureContext){ toast("⚠ https 주소에서만 마이크 사용 가능 (네트리파이 주소로 열어줘)"); return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ toast("이 브라우저는 녹음 미지원 (크롬/사파리로 열어줘)"); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast(e&&e.name==="NotAllowedError" ? "마이크가 '차단'됨. 주소창 왼쪽 자물쇠 → 마이크 '허용'으로 바꿔줘" : "마이크를 '허용'해야 녹음이 돼요"); setAI(false); return; }
  try{
    let mime="audio/webm"; if(window.MediaRecorder && !MediaRecorder.isTypeSupported(mime)) mime=MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"";
    aChunks=[]; mediaRec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    mediaRec.ondataavailable=e=>{ if(e.data&&e.data.size) aChunks.push(e.data); };
    mediaRec.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop()); aiRecording=false; setAI(false,"⏳ 인식중");
      let blob=new Blob(aChunks,{type:(mediaRec.mimeType||"audio/webm").split(";")[0]});
      try{ blob=await blobToWav(blob); }catch(e){ /* 변환 실패 시 원본으로 전송 */ }
      await sendToGemini(blob); setAI(false); };
    mediaRec.start(); aiRecording=true; setAI(true); toast("🔴 녹음 중… 다시 누르면 인식. 예: 숙주 한 박스, 쑥갓 삼백그램");
    clearTimeout(aiAutoStopTimer);
    aiAutoStopTimer=setTimeout(()=>{ if(aiRecording){ toast("⏱ 30초 지나 자동으로 인식 시작할게"); try{mediaRec.stop();}catch(_){} } },30000);
  }catch(e){ stream&&stream.getTracks().forEach(t=>t.stop()); toast("녹음 시작 실패"); setAI(false); }
}

/* ===== 데모 전용: AI 음성 인식 목업 =====
   실제 앱은 녹음 → Gemini(오디오 입력) → JSON 파싱 → 수량 반영 순서로 돈다.
   데모에서는 키와 마이크 권한 없이 그 흐름만 그대로 보여준다. */

function demoAIResult(){
  if(inBoardMode()){
    const a=boardAddSpokenLines(["대파 2","숙주 1박스","레몬 3","연어 300g"]);
    if(!a.length){ toast("❓ 인식된 품목 없음"); return; }
    toast("🤖 "+a.join(", ")); return;
  }
  const names=allItems().map(it=>it.name);
  if(!names.length){ toast("먼저 품목이 있는 매장 탭을 열어줘"); return; }
  const want=["숙주","대파","쑥갓","레몬","양파","깻잎","오이","당근"];
  const picks=want.filter(n=>names.includes(n)).slice(0,4);
  const use=picks.length?picks:names.slice(0,4);
  const qty=["1박스","2단","300g","3개"];
  const map={}; use.forEach((n,i)=>{ map[n]=qty[i%qty.length]; });
  applyAIMap(map);
}
function blobB64(blob){return new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob);});}
async function blobToWav(blob){
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) throw new Error("no AudioContext");
  const arr=await blob.arrayBuffer();
  const ctx=new AC();
  const buf=await new Promise((res,rej)=>{ const p=ctx.decodeAudioData(arr.slice(0), res, rej); if(p&&p.then)p.then(res,rej); });
  const rate=16000, src=buf.getChannelData(0), ratio=buf.sampleRate/rate, len=Math.floor(src.length/ratio);
  const out=new Float32Array(len); for(let i=0;i<len;i++) out[i]=src[Math.floor(i*ratio)]||0;
  try{ctx.close();}catch(_){}
  return encodeWav(out,rate);
}
function encodeWav(samples,rate){
  const buffer=new ArrayBuffer(44+samples.length*2), view=new DataView(buffer);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF"); view.setUint32(4,36+samples.length*2,true); w(8,"WAVE"); w(12,"fmt ");
  view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,rate,true); view.setUint32(28,rate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  w(36,"data"); view.setUint32(40,samples.length*2,true);
  let o=44; for(let i=0;i<samples.length;i++){let s=Math.max(-1,Math.min(1,samples[i])); view.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2;}
  return new Blob([view],{type:"audio/wav"});
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function sendToGemini(blob){
  const key=geminiKey(); if(!key){toast("AI 키 없음");return;}
  let b64; try{b64=await blobB64(blob);}catch(e){toast("녹음 처리 오류");return;}
  const board=inBoardMode();
  const items=board?[]:allItems().map(it=>it.name);
  const commonItems=board?(VB().commonItems||[]):[];
  const hintText=commonItems.length
    ? ('\n\n참고용 자주 발주하는 품목(정확한 표기 예시): '+commonItems.join(", ")+'. 발음이 이 목록과 비슷하면 이 표기를 우선 사용하되, 목록에 없는 품목도 자유롭게 인식해라.')
    : '';
  const prompt= board
    ? '다음 오디오는 한국어 발주(주문) 음성이다. 말한 품목들을 말한 순서대로 뽑아라. '
      +'각 항목은 "품목 수량" 형태의 짧은 문자열로 만들되, 수량의 한국어 수사·단위는 숫자·기호로 정규화하라(예: "밀 사"→"밀 4", "한 박스"→"1박스", "두 개"→"2개", "삼백그램"→"300g"). '
      +'수량이 없으면 품목만. 반드시 JSON 배열만 출력(설명·마크다운 금지): ["밀 4","단새우","벽 2"]'+hintText
    : '다음 오디오는 한국어 식자재 발주 음성이다. 아래 "품목목록" 중에서 말한 품목만 골라 수량을 뽑아라. '
      +'수량은 한국어 수사·단위를 숫자와 기호로 정규화하라(예: "한 박스"→"1박스", "삼백그램"→"300g", "두 단"→"2단"). '
      +'목록에 없는 품목은 무시. 반드시 JSON 객체만 출력(설명·마크다운 금지): {"품목명":"수량"}.\n\n품목목록: '+items.join(", ");
  const body={contents:[{parts:[{text:prompt},{inline_data:{mime_type:blob.type||"audio/webm",data:b64}}]}],generationConfig:{temperature:0,response_mime_type:"application/json",maxOutputTokens:300}};
  const models=[GEMINI_MODEL]; if(GEMINI_FALLBACK && GEMINI_FALLBACK!==GEMINI_MODEL) models.push(GEMINI_FALLBACK);
  const MAX=3;
  for(let attempt=0; attempt<MAX; attempt++){
    const model=models[Math.min(attempt,models.length-1)];
    const url="https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+encodeURIComponent(key);
    try{
      const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      let j={}; try{j=await r.json();}catch(_){}
      if(r.ok){
        let txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
        txt=txt.replace(/```json|```/g,"").trim();
        let parsed; try{parsed=JSON.parse(txt);}catch(e){ toast("AI 응답 파싱 실패 — 다시 말해줘"); return; }
        if(board){
          let arr=Array.isArray(parsed)?parsed:(parsed&&typeof parsed==="object"?Object.keys(parsed).map(k=>k+" "+parsed[k]):[]);
          const a=boardAddSpokenLines(arr.map(x=>String(x)));
          if(!a.length){ toast("❓ 인식된 품목 없음"); return; }
          toast("🤖 "+a.join(", ")); return;
        }
        applyAIMap(parsed); return;
      }
      const msg=(j.error&&j.error.message)||("HTTP "+r.status);
      const overloaded = r.status===503 || r.status===429 || r.status===500 || /overload|high demand|unavailable|try again|resource has been exhausted/i.test(msg);
      if(r.status===400 && /API key|API_KEY|invalid/i.test(msg)){ toast("AI 키가 잘못됨 — 사용방법에서 다시 설정"); return; }
      if(overloaded && attempt<MAX-1){ setAI(false,"⏳ 재시도"); toast("Gemini 혼잡… 자동 재시도 "+(attempt+1)+"/"+(MAX-1)); await sleep(1200*(attempt+1)); continue; }
      toast("Gemini 오류: "+msg); return;
    }catch(e){
      if(attempt<MAX-1){ toast("네트워크 재시도 "+(attempt+1)); await sleep(1000*(attempt+1)); continue; }
      toast("네트워크 오류 (인터넷 확인)"); return;
    }
  }
  toast("Gemini 혼잡이 계속돼요. 잠시 후 🤖 다시 눌러줘");
}
function applyAIMap(map){
  const names=allItems().map(it=>({it,name:normMatch(it.name)}));
  const applied=[];
  Object.keys(map||{}).forEach(k=>{
    const key=normMatch(k); let hit=names.find(x=>x.name===key)||names.find(x=>x.name.includes(key)||key.includes(x.name));
    if(!hit){ let best=null; names.forEach(x=>{const d=lev(key,x.name); if(!best||d<best.d)best={x,d};}); if(best&&best.d<=Math.max(1,Math.ceil(best.x.name.length*0.34)))hit=best.x; }
    if(hit){ const q=normalizeQty(String(map[k])); S().draft[hit.it.id]=q; applied.push(hit.it.name+" "+q); }
  });
  if(!applied.length){ toast("❓ 인식된 품목 없음"); return; }
  saveDB(); if(viewMode==="form") renderForm();
  toast("🤖 "+applied.join(", "));
}


/* 찾기 */
function renderFind(){
  const p=$('#panel');
  p.innerHTML=`<h2>찾기</h2>
    <p style="margin-top:0;color:#778"><b>${esc(S().name)}</b> 매장에서 품목 이름으로 검색 → 누르면 그 칸으로 바로 이동해서 커서까지 맞춰줌.</p>
    <div class="findbar"><input id="findq" placeholder="품목 검색 (예: 숙주, 대파)" autocomplete="off"></div>
    <div class="findlist" id="findlist"></div>`;
  const inp=$('#findq'), list=$('#findlist');
  function run(){
    const q=inp.value.trim().toLowerCase();
    list.innerHTML="";
    const rows=allItems().filter(it=>!q||it.name.toLowerCase().includes(q));
    if(!rows.length){ list.innerHTML='<p style="color:#889">"'+esc(inp.value)+'" 품목 없음. 편집모드에서 추가하면 여기서도 검색돼.</p>'; return; }
    rows.slice(0,80).forEach(it=>{
      const b=document.createElement('button'); b.className="findrow";
      b.innerHTML=`<span>${esc(it.name)}</span><span class="go">이동 →</span>`;
      b.onclick=()=>jumpToItem(it.id); list.appendChild(b);
    });
  }
  inp.oninput=run; run(); setTimeout(()=>inp.focus(),60);
}
function jumpToItem(id){
  showForm();
  requestAnimationFrame(()=>{
    const row=$('[data-iid="'+id+'"]');
    if(!row){ toast("품목을 찾지 못했어"); return; }
    row.scrollIntoView&&row.scrollIntoView({behavior:'smooth',block:'center'});
    row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'),1600);
    const q=row.querySelector('.qi'); if(q) setTimeout(()=>q.focus(),350);
  });
}

  showVoiceFabs(false); $('#textsheet').classList.remove('hide');
  $('#tvTitle').textContent=VT().name+" 발주";
  $('#tvEdit').textContent="✎ 편집"; $('#tvEdit').classList.remove('acc');
  renderTvStores(); renderTvBody(); window.scrollTo(0,0);
  if(!storageOK) toast("⚠ 미리보기라 저장 안됨 · 배포후 폰에서 저장됨");
}
function renderTvStores(){
  const el=$('#tvStores'); el.innerHTML="";
  VT().storeNames.forEach((nm,i)=>{const b=document.createElement('button');
    b.className="tab"+(i===VT().activeStore?" on":""); b.textContent=nm;
    b.onclick=()=>{VT().activeStore=i; saveDB(); renderTvStores(); updateTvPreview();};
    el.appendChild(b);});
}
function renderTvBody(){
  const v=VT(), body=$('#tvBody'); body.innerHTML="";
  const bar=document.createElement('div'); bar.className="tvbar";
  bar.innerHTML=tvEdit
    ? `<button class="btn sm warn" onclick="tvResetItems()">기본목록 복원</button><span class="tvcount">↑↓ 순서 · ✕ 삭제 · 이름 눌러 수정</span>`
    : `<button class="btn sm" onclick="tvClearChecks()">체크 초기화</button><span class="tvcount" id="tvCount"></span>`;
  body.appendChild(bar);

  if(tvEdit){
    const tb=document.createElement('div'); tb.className="box";
    tb.innerHTML=`<h3>메시지 문구 편집</h3>
      <p style="margin:.2em 0 .5em;color:#889;font-size:12px"><code>{store}</code> = 선택한 가게, <code>{items}</code> = 체크한 품목 자리. 이 둘은 그대로 두면 자동으로 채워짐.</p>
      <textarea id="tvTpl" class="tvtpl"></textarea>
      <div style="margin-top:8px"><button class="btn sm" onclick="tvResetTpl()">문구 기본값</button></div>`;
    body.appendChild(tb);
    const ta=tb.querySelector('#tvTpl'); ta.value=v.template||DEFAULT_TV_TEMPLATE;
    ta.oninput=e=>{v.template=e.target.value; saveDB();};
  }

  const list=document.createElement('div'); list.className="tvlist";
  v.items.forEach((it,idx)=>{
    const row=document.createElement('div'); row.className="tvrow";
    if(tvEdit){
      row.classList.add('edit');
      const inp=document.createElement('input'); inp.className="tvname"; inp.value=it.name;
      inp.onchange=e=>{it.name=e.target.value.trim()||it.name; saveDB();};
      const up=document.createElement('button'); up.className="mini"; up.textContent="↑"; up.onclick=()=>tvMove(idx,-1);
      const dn=document.createElement('button'); dn.className="mini"; dn.textContent="↓"; dn.onclick=()=>tvMove(idx,1);
      const del=document.createElement('button'); del.className="mini del"; del.textContent="✕"; del.onclick=()=>tvDel(idx);
      row.append(inp,up,dn,del);
    } else {
      const on=!!v.checked[it.id]; row.classList.toggle('on',on);
      const ck=document.createElement('span'); ck.className="ck"; ck.textContent=on?'✔':'';
      const nm=document.createElement('span'); nm.className="tnm"; nm.textContent=it.name;
      const qi=document.createElement('input'); qi.className="tvqty"; qi.type="text"; qi.inputMode="text"; qi.placeholder="수량"; qi.value=v.qty[it.id]||"";
      qi.onclick=e=>e.stopPropagation();
      qi.oninput=e=>{const val=e.target.value; if(val.trim()){v.qty[it.id]=val; v.checked[it.id]=true;} else {delete v.qty[it.id];}
        saveDB(); row.classList.toggle('on',!!v.checked[it.id]); ck.textContent=v.checked[it.id]?'✔':''; updateTvPreview();};
      row.append(ck,nm,qi);
      row.onclick=()=>{ if(v.checked[it.id]){delete v.checked[it.id]; delete v.qty[it.id];} else v.checked[it.id]=true; saveDB(); renderTvBody(); };
    }
    list.appendChild(row);
  });
  body.appendChild(list);

  if(tvEdit){
    const add=document.createElement('div'); add.className="tvadd";
    add.innerHTML=`<input id="tvNewName" placeholder="새 품목 이름 적고 추가"><button class="btn acc" onclick="tvAddItem()">＋ 추가</button>`;
    body.appendChild(add);
    const ni=add.querySelector('#tvNewName');
    ni.onkeydown=e=>{if(e.key==='Enter')tvAddItem();};
  } else {
    const pv=document.createElement('div'); pv.className="tvpreview";
    pv.innerHTML=`<div class="pvlabel">보낼 메시지</div><pre id="tvText"></pre>
      <button class="btn ok bigshare" onclick="tvShare()">📤 카톡으로 공유</button>
      <div class="mrow"><button class="btn" onclick="tvCopy()">📋 복사만</button></div>
      <div class="hint" style="padding:8px 2px 0">가게 선택 → 품목 체크·수량 입력 → 공유(또는 복사). 문구는 편집에서 바꿀 수 있음.</div>`;
    body.appendChild(pv);
  }
  updateTvPreview();
}
function tvMessage(){
  const v=VT(), store=v.storeNames[v.activeStore];
  const chosen=v.items.filter(it=>v.checked[it.id]).map(it=>{const q=((v.qty&&v.qty[it.id])||"").trim(); return q?(it.name+" "+q):it.name;});
  const items=chosen.length?chosen.join("\n"):"(품목을 체크하세요)";
  const tpl=v.template||DEFAULT_TV_TEMPLATE;
  return tpl.replace(/\{store\}/g,store).replace(/\{items\}/g,items);
}
function updateTvPreview(){
  const t=$('#tvText'); if(t) t.textContent=tvMessage();
  const c=$('#tvCount'); if(c){const n=VT().items.filter(it=>VT().checked[it.id]).length; c.textContent=n?n+"개 선택됨":"";}
}
async function tvShare(){
  const msg=tvMessage();
  try{ if(navigator.clipboard&&navigator.clipboard.writeText) await navigator.clipboard.writeText(msg); else fallbackCopy(msg,()=>{}); }catch(e){}
  if(navigator.share){
    try{ await navigator.share({text:msg}); return; }
    catch(e){ if(e&&e.name==="AbortError") return; }
  }
  toast("복사됨! 카톡방에 붙여넣기");
}
function tvCopy(){
  const msg=tvMessage();
  const done=()=>toast("복사됨! 카톡방에 붙여넣기");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(done).catch(()=>fallbackCopy(msg,done));
  } else fallbackCopy(msg,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast("복사 실패 - 메시지 길게 눌러 복사해줘"); }
  document.body.removeChild(ta);
}
function toggleTvEdit(){ tvEdit=!tvEdit; $('#tvEdit').textContent=tvEdit?"✓ 완료":"✎ 편집"; $('#tvEdit').classList.toggle('acc',tvEdit); renderTvBody(); }
function tvAddItem(){ const el=$('#tvNewName'); const nm=(el?el.value:"").trim(); if(!nm){toast("품목 이름을 적어줘"); if(el)el.focus(); return;} VT().items.push({id:uid(),name:nm}); saveDB(); renderTvBody(); const n=$('#tvNewName'); if(n)n.focus(); toast("추가됨: "+nm); }
function tvDel(idx){ const it=VT().items[idx]; VT().items.splice(idx,1); delete VT().checked[it.id]; if(VT().qty)delete VT().qty[it.id]; saveDB(); renderTvBody(); toast("삭제됨"); }
function tvMove(idx,dir){ const a=VT().items, j=idx+dir; if(j<0||j>=a.length)return; const t=a[idx]; a[idx]=a[j]; a[j]=t; saveDB(); renderTvBody(); }
function tvClearChecks(){ VT().checked={}; VT().qty={}; saveDB(); renderTvBody(); }
function tvResetItems(){ if(!confirm("품목을 기본목록으로 되돌릴까? 편집내용 사라짐."))return; VT().items=MONOMART_ITEMS.map(n=>({id:uid(),name:n})); VT().checked={}; VT().qty={}; saveDB(); renderTvBody(); }
function tvResetTpl(){ VT().template=DEFAULT_TV_TEMPLATE; saveDB(); renderTvBody(); toast("문구 기본값으로"); }

/* ===== 손글씨 발주판 (화이트보드 이미지) ===== */
function VB(){ return DB.vendors[curVendor]; }
const BOARD_FONT='"Nanum Myeongjo", Gungsuh, Batang, serif';
let boardFontsReady=false, boardTimer=null;
function openBoardVendor(){
  const v=VB(); if(!v.lines){ v.lines=[]; saveDB(); } if(!v.commonItems){ v.commonItems=[]; saveDB(); }
  $('#home').classList.add('hide'); $('#sheet').classList.add('hide'); $('#textsheet').classList.add('hide'); $('#boardsheet').classList.remove('hide');
  showVoiceFabs(true);
  $('#boardTitle').textContent=v.name;
  renderBoardStores(); renderBoardBody(); window.scrollTo(0,0);
  if(!storageOK) toast("⚠ 미리보기라 저장 안됨 · 배포후 폰에서 저장됨");

function renderBoardStores(){
  const v=VB(), wrap=$('#boardStores'); wrap.innerHTML="";
  v.storeNames.forEach((nm,i)=>{
    const b=document.createElement('button'); b.className="tab"+(i===v.activeStore?" on":""); b.textContent=nm;

function renderBoardBody(){
  const v=VB(), body=$('#boardBody'); body.innerHTML="";
  v.lines=(v.lines||[]).filter(l=>(l.text||"").trim());
  const addbar=document.createElement('div'); addbar.className="boardaddbar";
  addbar.innerHTML='<input id="boardInput" class="tvname" placeholder="품목 입력 (예: 밀 4)" autocomplete="off" enterkeyhint="done">'
    +'<button class="btn acc boardaddbtn" id="boardAddBtn">＋ 추가</button>';
  body.appendChild(addbar);
  const list=document.createElement('div'); list.className="tvlist"; list.style.marginTop="12px";
  if(!v.lines.length){ const e=document.createElement('div'); e.className="hint"; e.style.padding="4px 2px 0"; e.textContent="위 칸에 품목을 쓰고 ＋추가를 눌러줘. 하나씩 계속 추가돼요."; list.appendChild(e); }
  v.lines.forEach((ln,idx)=>{
    const row=document.createElement('div'); row.className="tvrow edit";
    const inp=document.createElement('input'); inp.className="tvname"; inp.value=ln.text||"";
    inp.oninput=e=>{ ln.text=e.target.value; scheduleBoardRender(); };
    const hl=document.createElement('button'); hl.className="mini hlbtn"+(ln.hl?" hlon":""); hl.textContent=ln.hl?"강조 ✓":"강조"; hl.title="중요 표시";
    hl.onclick=()=>{ ln.hl=!ln.hl; saveDB(); renderBoardBody(); };
    const del=document.createElement('button'); del.className="mini del"; del.textContent="✕";
    del.onclick=()=>{ v.lines.splice(idx,1); saveDB(); renderBoardBody(); };
    row.append(inp,hl,del); list.appendChild(row);
  });
  body.appendChild(list);
  const pv=document.createElement('div'); pv.className="boardpreview";
  pv.innerHTML='<div class="pvlabel">미리보기 (실제 이미지)</div><canvas id="boardCanvas"></canvas>'
    +'<div class="mrow" style="margin-top:12px"><button class="btn ok" onclick="boardSave()">📷 이미지 저장</button><button class="btn" onclick="boardShare()">📤 공유하기</button></div>'
    +'<div class="hint" style="padding:10px 2px 0">품목 쓰고 <b>＋추가</b>를 계속 누르면 하나씩 들어가요. 중요항목은 <b>강조</b>. 오른쪽 아래 🎤/🤖로 말로도 입력돼요. 글씨는 자동으로 꽉 차게 조절돼요.</div>';
  body.appendChild(pv);
  const bi=$('#boardInput'), ba=$('#boardAddBtn');
  const doAdd=()=>{ const t=(bi.value||"").trim(); if(!t){ bi.focus(); return; } VB().lines.push({text:t,hl:false}); saveDB(); renderBoardBody(); const bi2=$('#boardInput'); if(bi2){ bi2.value=""; bi2.focus(); } };
  ba.onclick=doAdd;
  bi.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); doAdd(); } };
  ensureBoardFontsThenRender();
}
function inBoardMode(){ const b=$('#boardsheet'); return !!(b && !b.classList.contains('hide')); }
function boardNormalizeSpoken(t){
  t=(t||"").trim().replace(/\s+/g," "); if(!t) return "";
  const toks=t.split(" ");
  if(toks.length<2) return t; // 한 단어면 품목명 그대로 (예: 단새우)
  const lm=normMatch(toks[toks.length-1]);
  const n=parseLeadingNum(lm);
  if(n && n.len===lm.length){ toks[toks.length-1]=n.num; return toks.join(" "); }
  const nq=normalizeQty(lm);
  if(/^\d/.test(nq) && nq!==lm){ toks[toks.length-1]=nq; return toks.join(" "); }
  return t;
}
function boardAddSpokenLines(arr){
  const v=VB(); if(!v.lines)v.lines=[];
  v.lines=v.lines.filter(l=>(l.text||"").trim());
  const added=[];
  arr.forEach(s=>{ s=(s||"").trim(); if(s){ v.lines.push({text:s,hl:false}); added.push(s); } });
  saveDB(); renderBoardBody();
  return added;
}
function scheduleBoardRender(){ saveDB(); if(boardTimer)clearTimeout(boardTimer); boardTimer=setTimeout(()=>renderBoardCanvas(false),130); }
function ensureBoardFontsThenRender(){
  if(boardFontsReady){ renderBoardCanvas(false); return; }
  const done=()=>{ boardFontsReady=true; renderBoardCanvas(false); };
  if(document.fonts&&document.fonts.load){
    Promise.all([document.fonts.load("800 100px 'Nanum Myeongjo'"),document.fonts.load("700 100px 'Nanum Myeongjo'")]).then(done).catch(done);
    setTimeout(()=>{ if(!boardFontsReady)done(); },1500);
  } else done();
}
function roundRect(ctx,x,y,w,h,r){ r=Math.min(r,h/2,w/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function renderBoardCanvas(forExport){
  const v=VB();
  const store=v.storeNames[v.activeStore]||"";
  const items=v.lines.map(l=>({text:(l.text||"").trim(),hl:!!l.hl})).filter(l=>l.text.length);
  const W=1080,H=1440;
  const canvas = forExport ? document.createElement('canvas') : $('#boardCanvas');
  if(!canvas) return null;
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  const marginX=70, marginTop=80, marginBottom=80;
  const avail=H-marginTop-marginBottom;
  const n=items.length;
  const fits=(f)=>{
    const ilh=f*1.42, tf=Math.min(f*1.45,190), tlh=tf*1.4, tgap=f*0.5;
    const total=tlh+tgap+n*ilh;
    if(total>avail) return false;
    ctx.font="800 "+tf+"px "+BOARD_FONT;
    if(ctx.measureText(store).width>W-2*marginX) return false;
    ctx.font="700 "+f+"px "+BOARD_FONT;
    for(const it of items){ if(ctx.measureText(it.text).width>W-2*marginX-50) return false; }
    return true;
  };
  let f=150; while(f>26&&!fits(f)) f-=2;
  const ilh=f*1.42, tf=Math.min(f*1.45,190), tlh=tf*1.4, tgap=f*0.5;
  const totalH=tlh+tgap+n*ilh;
  let y=marginTop+Math.max(0,(avail-totalH)/2);
  ctx.fillStyle="#111"; ctx.font="800 "+tf+"px "+BOARD_FONT;
  ctx.fillText(store, W/2, y+tlh/2);
  // 밑줄
  const uw=Math.min(ctx.measureText(store).width+40, W-2*marginX);
  ctx.fillRect((W-uw)/2, y+tlh-6, uw, Math.max(4,tf*0.045));
  y+=tlh+tgap;
  ctx.font="700 "+f+"px "+BOARD_FONT;
  for(const it of items){
    const cy=y+ilh/2;
    if(it.hl){
      const tw=ctx.measureText(it.text).width, padX=26;
      const rh=f*1.02, rw=Math.min(tw+2*padX, W-2*marginX+40), ry=cy-rh/2, rx=(W-rw)/2;
      ctx.fillStyle="#ffe23d"; roundRect(ctx,rx,ry,rw,rh,14); ctx.fill();
    }
    ctx.fillStyle="#111";
    ctx.fillText(it.text, W/2, cy);
    y+=ilh;
  }
  if(!n && !forExport){ ctx.fillStyle="#c2c8d0"; ctx.font="700 46px "+BOARD_FONT; ctx.fillText("품목을 입력하면 여기 나와요", W/2, H/2+120); }
  return canvas;
}
function boardBlob(cb){ const c=renderBoardCanvas(true); if(!c){toast("생성 실패");return;} c.toBlob(b=>{ if(!b){toast("이미지 생성 실패");return;} cb(b); },"image/png"); }
function boardFileName(){ return "발주_"+(VB().storeNames[VB().activeStore]||"board")+".png"; }
function boardSave(){
  const items=VB().lines.filter(l=>(l.text||"").trim()); if(!items.length){ toast("품목을 먼저 입력해줘"); return; }
  boardBlob(b=>{ const url=URL.createObjectURL(b); const a=document.createElement('a'); a.href=url; a.download=boardFileName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); toast("이미지 저장됨"); });
}
async function boardShare(){
  const items=VB().lines.filter(l=>(l.text||"").trim()); if(!items.length){ toast("품목을 먼저 입력해줘"); return; }
  if(inApp()){ showInAppBanner(); toast("카톡 안에서는 공유가 막혀요. 위 '"+recommendedBrowser()+"로 열기' 버튼을 눌러줘"); return; }
  boardBlob(async b=>{
    const file=new File([b],boardFileName(),{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); }
      catch(e){ if(e&&e.name!=="AbortError") toast("공유가 취소됐어"); }
    } else { toast("이 브라우저는 이미지 공유 미지원 → 이미지 저장을 써줘"); }
  });
}

function resetTemplate(){if(!confirm(`${S().name} 품목을 기본폼(원본)으로 되돌릴까? 편집내용 사라짐.`))return;
  S().template=defaultTemplate(); S().draft={}; saveDB(); renderForm(); toast("기본폼 복원");}

if(!DB.vendors.some(v=>v.id==="monomart")){ DB.vendors.push(monomartVendor()); saveDB(); }
if(!DB.vendors.some(v=>v.id==="biwon")){ DB.vendors.push(boardVendor()); saveDB(); }
(function(){ const bv=DB.vendors.find(v=>v.id==="biwon"); if(bv&&bv.storeNames&&bv.storeNames.includes("매장1")){ const wasFirst=bv.activeStore===0; bv.storeNames=bv.storeNames.filter(s=>s!=="매장1"); if(bv.activeStore>0)bv.activeStore--; if(wasFirst)bv.activeStore=0; if(bv.activeStore>=bv.storeNames.length)bv.activeStore=0; saveDB(); } })();
renderHome();
showInAppBanner();
</script>
