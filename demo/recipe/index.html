<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다국어 주방 레시피 — 포트폴리오 데모</title>
<style>
  :root{
    --bg:#15181D; --surface:#1B1F26; --well:#222831;
    --line:#2C333C; --line-soft:#232a32;
    --text:#ECEAE4; --muted:#889099;
    --steel:#74B9C9; --steel-dim:rgba(116,185,201,.16);
    --red:#E2493B; --red-soft:#EA8163; --blue:#6CA9D9; --green:#6CC18C; --amber:#E0A93F;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,"Segoe UI",Roboto,sans-serif;
    --serif:"Apple SD Gothic Neo","Nanum Myeongjo","Noto Serif KR",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  /* ===== LOCK / SPLASH ===== */
  #lock{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#1b1f26 0%,#15181D 60%);
    display:flex;align-items:center;justify-content:center;padding:28px 24px}
  .lock-card{width:100%;max-width:370px;text-align:center}

  .brand{display:flex;flex-direction:column;align-items:center;margin-bottom:30px}
  .mark{position:relative;width:118px;height:118px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .mark .ring{position:absolute;inset:0;color:#39424d}
  .mark .han{font-family:var(--serif);font-weight:800;font-size:70px;color:var(--red);line-height:1}
  .mark .han-dot{position:absolute;top:4px;right:6px;width:33px;height:33px;border-radius:50%;
    background:var(--red);display:flex;align-items:center;justify-content:center;color:#15181D;
    font-weight:800;font-size:17px;box-shadow:0 3px 12px rgba(226,73,59,.4)}
  .brand-wordmark{font-size:13px;letter-spacing:.34em;color:var(--text);font-weight:600}
  .brand-sub{font-size:10px;letter-spacing:.3em;color:var(--muted);font-weight:600;margin-top:8px}

  .lock-inp{display:flex;background:var(--well);border:1px solid var(--line);border-radius:12px;
    padding:0 14px;transition:border-color .15s,box-shadow .15s}
  .lock-inp:focus-within{border-color:var(--steel);box-shadow:0 0 0 3px var(--steel-dim)}
  .lock-inp input{flex:1;background:none;border:0;outline:0;color:var(--text);font-family:var(--sans);
    font-size:17px;font-weight:600;letter-spacing:.3em;text-align:center;padding:15px 0}
  .lock-inp input::placeholder{letter-spacing:.18em;color:#5c636d;font-weight:400}
  .lock-btn{width:100%;margin-top:12px;background:var(--red);color:#fff;border:0;border-radius:12px;
    padding:15px;font-size:15px;font-weight:800;font-family:var(--sans);cursor:pointer;letter-spacing:.04em}
  .lock-btn:active{transform:scale(.985)}
  .lock-err{font-size:12.5px;color:var(--red-soft);height:18px;margin-top:12px;font-weight:600;opacity:0;transition:.15s}
  .lock-err.show{opacity:1}

  .divider{height:1px;background:var(--line);margin:26px 0 22px}
  .sig{display:inline-flex;align-items:center;gap:13px}
  .seal{width:44px;height:44px;flex:none;border:2px solid var(--red);border-radius:8px;color:var(--red);
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.92;
    font-weight:800;font-size:16px;transform:rotate(-5deg);background:rgba(226,73,59,.08)}
  .sig-text{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .sig-cap{font-size:9.5px;color:var(--muted);letter-spacing:.3em;font-weight:700}
  .sig-main{font-size:17px;color:var(--text);font-weight:600;letter-spacing:.01em;font-style:italic}
  .sig-brush{color:var(--red);margin-top:1px}
  .lock-foot{font-size:10.5px;color:#5c636d;margin-top:26px;letter-spacing:.04em}

  /* ===== APP ===== */
  #app{display:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 60px}

  .top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:18px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .hd-brand{display:flex;align-items:center;gap:0}
  .hd-l h1{font-size:26px;font-weight:850;letter-spacing:-.035em;margin:0;line-height:1.05}
  .badge-conf{font-size:10px;font-weight:700;color:var(--amber);border:1px solid rgba(224,169,63,.4);
    background:rgba(224,169,63,.1);padding:5px 9px;border-radius:7px;white-space:nowrap;letter-spacing:.04em}

  .search{display:flex;align-items:center;gap:9px}
  .search-box{flex:1;display:flex;align-items:center;background:var(--well);border:1px solid var(--line);
    border-radius:12px;padding:0 6px 0 13px;transition:border-color .15s,box-shadow .15s}
  .search-box:focus-within{border-color:var(--steel);box-shadow:0 0 0 3px var(--steel-dim)}
  .search-box svg.s-ico{color:var(--muted);flex:none}
  .search-box input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);
    font-family:var(--sans);font-size:16px;font-weight:500;padding:13px 8px}
  .search-box input::placeholder{color:#5c636d;font-weight:400}
  .clear-btn{flex:none;width:30px;height:30px;border:0;background:none;color:var(--muted);cursor:pointer;
    display:none;align-items:center;justify-content:center;border-radius:8px}
  .clear-btn.show{display:flex}
  .mic-btn{flex:none;width:48px;height:48px;border-radius:12px;background:var(--surface);
    border:1px solid var(--line);color:var(--steel);cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:.15s;position:relative}
  .mic-btn:active{transform:scale(.95)}
  .mic-btn.listening{background:rgba(226,73,59,.16);border-color:var(--red);color:var(--red-soft)}
  .mic-btn.listening::after{content:"";position:absolute;inset:-4px;border-radius:14px;
    border:2px solid var(--red);animation:pulse 1.1s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.18);opacity:0}}

  .vstatus{font-size:12px;color:var(--muted);min-height:17px;margin:9px 2px 0;font-weight:500}
  .vstatus b{color:var(--steel)}
  .vstatus.err{color:var(--red-soft)}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:13px 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);
    border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:.13s}
  .chip:active{transform:scale(.96)}
  .chip.active{background:var(--steel);color:#0c1116;border-color:var(--steel)}

  .group{margin-bottom:8px}
  .group-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
  .group-title::before{content:"";width:2px;height:11px;background:var(--red);border-radius:2px}
  .group-title .gc{color:#5c636d;font-weight:600}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden}
  .card-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;cursor:pointer;padding:15px;text-align:left;font-family:var(--sans);color:var(--text)}
  .card-name{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .card-tag{font-size:10.5px;color:var(--muted);font-weight:600;margin-left:8px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;vertical-align:middle;white-space:nowrap}
  .card-meta{display:flex;align-items:center;gap:11px;flex:none}
  .time{font-size:11.5px;color:var(--amber);font-weight:700;white-space:nowrap;border:1px solid rgba(224,169,63,.35);border-radius:6px;padding:3px 7px}
  .chev{color:var(--muted);transition:transform .2s}
  .card.open .chev{transform:rotate(180deg)}

  .card-body{display:none;padding:2px 15px 16px;border-top:1px solid var(--line-soft)}
  .card.open .card-body{display:block}
  .step{font-size:14px;line-height:1.55;color:var(--text);padding:7px 0;border-bottom:1px solid var(--line-soft)}
  .step:last-child{border-bottom:0}
  .step.must{font-weight:600;padding-left:11px;border-left:2px solid var(--red);margin:5px 0;background:rgba(226,73,59,.06);border-radius:0 7px 7px 0}
  .step.memo{color:var(--amber);font-style:italic;font-weight:500}
  .step.memo .ico{margin-right:6px;font-style:normal}
  .lab{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:8px;vertical-align:1px;letter-spacing:.02em}
  .lab-deco{color:var(--green);background:rgba(108,193,138,.13);border:1px solid rgba(108,193,138,.32)}
  .lab-set{color:var(--steel);background:var(--steel-dim);border:1px solid rgba(116,185,201,.32)}
  .hl-red{color:var(--red-soft);font-weight:700}
  .hl-blue{color:var(--blue);font-weight:700}

  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:48px 20px;line-height:1.6}
  .count{font-size:11.5px;color:#5c636d;margin:2px 2px 0;font-weight:500}


  /* ===== CUSTOM SPLASH / FIRST SCREEN ===== */
  #lock{
    position:fixed;inset:0;z-index:50;background:#000;
    display:flex;align-items:center;justify-content:center;padding:18px 20px;
  }
  .lock-card{
    width:100%;max-width:430px;min-height:100dvh;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:22px 0;
  }
  .splash-img{
    display:block;width:100%;max-width:430px;max-height:56dvh;object-fit:contain;
    margin:0 auto 26px;border:0;filter:drop-shadow(0 14px 28px rgba(0,0,0,.55));
  }
  .lock-panel{
    width:100%;max-width:340px;background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:14px;
    box-shadow:0 18px 45px rgba(0,0,0,.42);backdrop-filter:blur(8px);
  }
  .lock-inp{
    display:flex;background:rgba(27,31,38,.92);border:1px solid rgba(255,255,255,.12);
    border-radius:12px;padding:0 14px;transition:border-color .15s,box-shadow .15s;
  }
  .lock-inp:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(226,73,59,.18)}
  .lock-btn{
    width:100%;margin-top:10px;background:var(--red);color:#fff;border:0;border-radius:12px;
    padding:15px;font-size:15px;font-weight:800;font-family:var(--sans);cursor:pointer;letter-spacing:.04em;
  }
  .madeby{
    margin-top:18px;color:rgba(236,234,228,.78);font-size:12.5px;font-weight:600;
    letter-spacing:.08em;text-shadow:0 2px 12px rgba(0,0,0,.7);
  }



  /* CSS fallback: even if button/JavaScript does not fire, typing exactly 1234 unlocks */
  body:has(#pw:valid) #lock{display:none!important}
  body:has(#pw:valid) #app{display:block!important}


  /* 데모: 비공개 처리된 분량 */
  .rd{display:inline-block;min-width:2.6em;padding:0 .35em;margin:0 .1em;
      border-radius:4px;background:var(--muted,#8b8b8b);color:transparent;
      opacity:.45;user-select:none;vertical-align:baseline;
      font-size:.92em;line-height:1.3}
  .demo-note{margin:0 0 11px;padding:9px 11px;border-radius:10px;
      background:rgba(255,255,255,.05);border:1px solid var(--line);
      color:var(--muted);font-size:12px;line-height:1.6}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .lang-bar{display:flex;gap:6px;margin:0 0 11px}
  .lang-btn{flex:1;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 6px;cursor:pointer;font-family:var(--sans);transition:.13s;white-space:nowrap}
  .lang-btn.active{background:var(--steel);color:#0c1116;border-color:var(--steel)}
  .name-sub{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:4px;line-height:1.4}
  .name-sub .romaji{color:var(--steel);font-weight:700}
  .step .loc{display:block}
  .step .ko-sub{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:400;line-height:1.45}
  .guide-wrap{margin:0 0 12px}
  .guide-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--text);text-align:left}
  .guide-toggle .gv{flex:none;color:var(--muted);transition:transform .2s}
  .guide-wrap.open .guide-toggle .gv{transform:rotate(180deg)}
  .guide-panel{display:none;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px 12px}
  .guide-wrap.open .guide-panel{display:block}
  .guide-sec{font-size:11px;font-weight:800;color:var(--steel);text-transform:uppercase;letter-spacing:.04em;margin:13px 0 5px}
  .guide-item{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--line-soft);font-size:12.5px;line-height:1.45}
  .guide-sec + .guide-item{border-top:0}
  .guide-k{flex:0 0 36%;font-weight:700;color:var(--text)}
  .guide-v{flex:1;color:var(--muted)}
  .tip-hint{font-size:12px;color:var(--steel);background:rgba(116,185,201,.08);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin:0 0 11px;line-height:1.4}
  .ko-sub .term{border-bottom:1px dotted var(--steel);cursor:pointer}
  .ko-sub .term:active{color:var(--steel)}
  .term-tip{position:fixed;left:12px;right:12px;bottom:14px;max-width:680px;margin:0 auto;background:var(--steel);color:#0c1116;border-radius:12px;padding:13px 16px;box-shadow:0 10px 34px rgba(0,0,0,.45);display:none;align-items:center;gap:11px;z-index:200}
  .term-tip.show{display:flex}
  .term-tip .tip-k{font-weight:800;font-size:14px;flex:none}
  .term-tip .tip-v{flex:1;font-size:13px;font-weight:600;line-height:1.4}
  .term-tip .tip-x{flex:none;opacity:.55;font-size:13px;font-weight:700}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
  .photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block;cursor:zoom-in}
  .ph-cap{font-size:11px;color:var(--muted);font-weight:600;margin:11px 2px 0;letter-spacing:.02em}
  #phView{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;padding:14px}
  #phView.show{display:flex}
  #phView img{max-width:100%;max-height:92dvh;object-fit:contain;border-radius:10px}
</style>
</head>

 "연두":{pt:"Yeondu (요리에센스 연두) — tempero líquido de soja fermentada; usar SEMPRE a garrafa de rótulo verde",vi:"Yeondu (요리에센스 연두) — nước nêm đậu nành lên men; LUÔN dùng chai nhãn xanh lá"},
 "트러플":{pt:"molho de trufa (não é cogumelo fresco)",vi:"sốt nấm truffle (không phải nấm tươi)"}
};
const TERM_RE = (function(){
  const keys=Object.keys(TERMS).filter(k=>k!=="t").sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  return new RegExp('(\\d+\\.?\\d*t|'+keys.join('|')+')','g');
})();
function termKey(m){ return /\d.*t$/.test(m) ? "t" : m; }
function wrapTerms(s){
  return s.replace(TERM_RE, m=>{ const k=termKey(m); return TERMS[k] ? '<span class="term" data-k="'+k+'">'+m+'</span>' : m; });
}
function showTip(k){
  const d=TERMS[k]; if(!d) return; const def=d[lang]; if(!def) return;
  const el=$("termTip");
  el.innerHTML='<span class="tip-k">'+esc(k)+'</span><span class="tip-v">'+esc(def)+'</span><span class="tip-x">✕</span>';
  el.classList.add("show");
}
function closeTip(){ const el=$("termTip"); if(el) el.classList.remove("show"); }


/* 데모: 데이터에서 이미 지워진 분량 자리를 가림막으로 그린다.
   원문은 파일에 남아 있지 않다 — 소스를 봐도 ▩ 만 보인다. */
function redact(h){ return h.replace(/\u25a9+/g, '<span class="rd">\u00a0\u00a0\u00a0</span>'); }
function renderStep(ko, loc){ return redact(renderStepRaw(ko, loc)); }
function renderStepRaw(ko, loc){
  const showLoc = (lang!=="ko") && loc;
  if(ko.startsWith("메모:")){
    const koTxt = ko.slice(3).trim();
    if(showLoc) return '<div class="step memo"><span class="ico">✎</span>'+esc(loc)+'<span class="ko-sub">'+esc(koTxt)+'</span></div>';
    return '<div class="step memo"><span class="ico">✎</span>'+esc(koTxt)+'</div>';
  }
  let cls="step", labelKey=null, koBody=ko;
  if(ko.startsWith("데코")){ labelKey="데코"; koBody=ko.replace(/^데코\s*/,""); }
  else if(ko.startsWith("세팅")){ labelKey="세팅"; koBody=ko.replace(/^세팅\s*/,""); }
  else if(ko.startsWith("소스")){ labelKey="소스"; koBody=ko.replace(/^소스\s*/,""); }
  else if(ko.startsWith("반드시")){ cls="step must"; }
  let label="";
  if(labelKey){
    const L=LABELS[labelKey];
    const txt=(lang==="ko")?labelKey:(lang==="pt"?L.pt:L.vi);
    label='<span class="lab '+L.cls+'">'+txt+'</span>';
  }
  if(showLoc){
    return '<div class="'+cls+'">'+label+'<span class="loc">'+esc(loc)+'</span><span class="ko-sub">'+wrapTerms(esc(koBody))+'</span></div>';
  }
  return '<div class="'+cls+'">'+label+hlKo(esc(koBody))+'</div>';
}

const listEl = $("list");
R.forEach((r,i)=>{ r.hay = norm(r.n + (r.r||"") + (r.pt||"") + (r.vi||"") + r.a.join("") + r.st.join("") + (r.stp||[]).join("") + (r.stv||[]).join("")); r.idx = i; });

function buildChips(){
  const chips = $("chips");
  const cats = ["전체"].concat(SHORT);
  cats.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="chip"+(i===0?" active":"");
    b.textContent=c;
    b.dataset.g = i===0 ? "all" : (i-1);
    b.addEventListener("click",()=>{ document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active")); b.classList.add("active"); activeG=b.dataset.g; if(activeG!=="all"){$("q").value="";$("clear").classList.remove("show");} filter(); });
    chips.appendChild(b);
  });
}

const PH_CAP={ko:"완성 사진",pt:"Foto do prato finalizado",vi:"\u1ea2nh m\u00f3n ho\u00e0n thi\u1ec7n"};
function photosHtml(r){
  if(!r.ph || !r.ph.length) return "";
  return '<div class="ph-cap">\ud83d\udcf7 '+(PH_CAP[lang]||PH_CAP.ko)+'</div><div class="photos">'+
    r.ph.map(u=>'<img src="'+u+'" loading="lazy" alt="">').join("")+'</div>';
}
function buildList(){
  G.forEach((gName,gi)=>{
    const sec=document.createElement("div");
    sec.className="group"; sec.dataset.group=gi;
    const cnt = R.filter(r=>r.g===gi).length;
    sec.innerHTML='<div class="group-title">'+esc(gName)+' <span class="gc">'+cnt+'</span></div>';
    R.filter(r=>r.g===gi).forEach(r=>{
      const card=document.createElement("article");
      card.className="card"; card.dataset.idx=r.idx; card.dataset.g=r.g;
      const timeHtml = r.t ? '<span class="time">⏱ '+r.t+'</span>' : '';
      const locArr = lang==="ko" ? null : (lang==="pt" ? r.stp : r.stv);
      const subHtml = lang==="ko" ? "" :
        '<span class="name-sub"><span class="romaji">'+esc(r.r||"")+'</span> · '+esc(lang==="pt"?(r.pt||""):(r.vi||""))+'</span>';
      card.innerHTML =
        '<button class="card-head" aria-expanded="false">'+
          '<span class="card-name">'+esc(r.n)+'<span class="card-tag">'+SHORT[r.g]+'</span>'+subHtml+'</span>'+
          '<span class="card-meta">'+timeHtml+
            '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>'+
          '</span>'+
        '</button>'+
        '<div class="card-body">'+ r.st.map((s,i)=>renderStep(s, locArr?locArr[i]:null)).join("") + photosHtml(r) +'</div>';
      const head=card.querySelector(".card-head");
      head.addEventListener("click",()=>{ const open=card.classList.toggle("open"); head.setAttribute("aria-expanded",open); });
      sec.appendChild(card);
    });
    listEl.appendChild(sec);
  });
}

let activeG="all";
function filter(){
  const q = norm($("q").value);
  let visible=0;
  document.querySelectorAll(".card").forEach(card=>{
    const r = R[+card.dataset.idx];
    const okG = activeG==="all" || (+card.dataset.g)===(+activeG);
    const okQ = q==="" || r.hay.includes(q);
    const show = okG && okQ;
    card.style.display = show ? "" : "none";
    if(show){ visible++; if(q!==""){ card.classList.add("open"); card.querySelector(".card-head").setAttribute("aria-expanded",true); } }
  });
  document.querySelectorAll(".group").forEach(sec=>{
    const any=[...sec.querySelectorAll(".card")].some(c=>c.style.display!=="none");
    sec.style.display = any ? "" : "none";
  });
  $("empty").style.display = visible===0 ? "block" : "none";
  const unit = lang==="pt" ? " itens" : (lang==="vi" ? " món" : "개 메뉴");
  $("count").textContent = (q!=="" || activeG!=="all") ? visible+unit : R.length+unit;
}
function setLang(l){
  lang=l;
  document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active", b.dataset.lang===l));
  const ph={ko:"메뉴·재료 검색 (예: 가라아게, 명란)", pt:"Buscar prato / ingrediente", vi:"Tìm món / nguyên liệu"};
  $("q").placeholder = ph[l] || ph.ko;
  const hint={pt:"💡 Toque numa palavra coreana sublinhada para ver o significado", vi:"💡 Chạm vào từ tiếng Hàn gạch chân để xem nghĩa"};
  const th=$("tipHint");
  if(th){ th.textContent=hint[l]||""; th.style.display = (l==="ko") ? "none" : "block"; }
  closeTip();
  renderGuide();
  listEl.innerHTML="";
  buildList();
  filter();
}
function renderGuide(){
  const wrap=$("guideWrap"); const g=GUIDE[lang];
  if(!g){ if(wrap) wrap.style.display="none"; return; }
  if(wrap) wrap.style.display="";
  const tg=document.querySelector("#guideToggle .gt"); if(tg) tg.textContent=g.btn;
  let h='<div class="guide-sec">'+esc(g.uTitle)+'</div>';
  g.units.forEach(p=>{ h+='<div class="guide-item"><span class="guide-k">'+esc(p[0])+'</span><span class="guide-v">'+esc(p[1])+'</span></div>'; });
  h+='<div class="guide-sec">'+esc(g.tTitle)+'</div>';
  g.terms.forEach(p=>{ h+='<div class="guide-item"><span class="guide-k">'+esc(p[0])+'</span><span class="guide-v">'+esc(p[1])+'</span></div>'; });
  $("guidePanel").innerHTML=h;
}

$("q").addEventListener("input",()=>{ $("clear").classList.toggle("show", $("q").value.length>0); filter(); });
$("clear").addEventListener("click",()=>{ $("q").value=""; $("clear").classList.remove("show"); filter(); $("q").focus(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $("mic"), vstatus = $("vstatus");
if(!SR){
  mic.style.display="none";
  vstatus.textContent="음성 검색 미지원 브라우저 — 검색창의 키보드 마이크를 이용하세요.";
} else {
  let rec=null, listening=false;
  mic.addEventListener("click",()=>{
    if(listening){ rec && rec.stop(); return; }
    rec = new SR(); rec.lang="ko-KR"; rec.interimResults=false; rec.maxAlternatives=1;
    rec.onstart=()=>{ listening=true; mic.classList.add("listening"); vstatus.className="vstatus"; vstatus.innerHTML="🎙️ 듣는 중… 메뉴 이름을 말하세요"; };
    rec.onerror=(e)=>{ vstatus.className="vstatus err"; vstatus.textContent = e.error==="not-allowed" ? "마이크 권한을 한 번 허용하면 그 다음부턴 바로 됩니다." : "음성을 인식하지 못했습니다. 다시 시도해주세요."; };
    rec.onend=()=>{ listening=false; mic.classList.remove("listening"); };
    rec.onresult=(e)=>{
      const t = e.results[0][0].transcript.trim();
      $("q").value=t; $("clear").classList.add("show");
      document.querySelectorAll(".chip").forEach((x,i)=>x.classList.toggle("active",i===0));
      activeG="all"; filter();
      const vis=[...document.querySelectorAll(".card")].filter(c=>c.style.display!=="none");
      vstatus.className="vstatus";
      if(vis.length===0){ vstatus.innerHTML='인식: <b>'+esc(t)+'</b> · 결과 없음'; }
      else { vstatus.innerHTML='인식: <b>'+esc(t)+'</b> · '+vis.length+'개'; if(vis.length===1){ vis[0].scrollIntoView({behavior:"smooth",block:"center"}); } }
    };
    try{ rec.start(); }catch(err){}
  });
}

function normalizePw(v){
  return String(v || "")
    .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[^0-9]/g, "")
    .trim();
}

function unlock(){
  const pw = $("pw"), lock = $("lock"), app = $("app"), q = $("q");
  const v = normalizePw(pw.value);
  if(v === PASS){
    lock.style.display = "none";
    app.style.display = "block";
    setTimeout(() => { if(q) q.focus(); }, 80);
    return;
  }
  $("pwErr").classList.add("show");
  pw.value = "";
  pw.focus();
  setTimeout(() => $("pwErr").classList.remove("show"), 2200);
}

window.unlock = unlock;
$("enter").addEventListener("click", unlock);
$("enter").addEventListener("touchend", e => { e.preventDefault(); unlock(); }, {passive:false});
$("pw").addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });
$("pw").addEventListener("input", () => {
  if(normalizePw($("pw").value) === PASS){
    setTimeout(unlock, 80);
  }
});

buildChips(); buildList(); filter();
/* 데모: 잠금 화면 없이 바로 진입 */
$("lock").style.display = "none";
$("app").style.display = "block";
document.querySelectorAll(".lang-btn").forEach(b=>{
  b.addEventListener("click",()=>setLang(b.dataset.lang));
});
$("guideToggle").addEventListener("click",()=>$("guideWrap").classList.toggle("open"));
document.addEventListener("click",e=>{
  const im=e.target.closest(".photos img");
  if(im){ const v=$("phView"); v.innerHTML='<img src="'+im.src+'" alt="">'; v.classList.add("show"); e.stopPropagation(); return; }
  if(e.target.closest("#phView")){ $("phView").classList.remove("show"); return; }
  const t=e.target.closest(".term");
  if(t){ showTip(t.dataset.k); e.stopPropagation(); return; }
  if(!e.target.closest("#termTip")) closeTip();
});
renderGuide();
</script>
