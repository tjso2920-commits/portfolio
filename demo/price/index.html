<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단가서치 — 포트폴리오 데모</title>
<style>
  :root{
    --navy:#1f2a44; --red:#d23f3f; --amber:#e7a13d; --green:#2f8f5b; --purple:#7a52c9;
    --sashimi:#0e7c86;
    --ink:#202124; --sub:#5f6368; --line:#dfe1e5; --line2:#ecedef;
    --bg:#ffffff; --chip:#f1f3f4; --up:#c0392b; --dn:#1e6f3c; --flux:#b07d1a;
    --shadow:0 1px 6px rgba(32,33,36,.16); --shadow2:0 2px 12px rgba(32,33,36,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  button{font-family:inherit}

  /* ===== top supplier tabs ===== */
  .topbar{display:flex;align-items:center;gap:6px;padding:14px 18px;flex-wrap:wrap;
    border-bottom:1px solid var(--line2);position:sticky;top:0;background:rgba(255,255,255,.94);
    backdrop-filter:saturate(1.2) blur(6px);z-index:20}
  .flask{width:26px;height:26px;flex:0 0 auto;color:var(--sub)}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{border:0;background:transparent;color:var(--sub);font-size:14px;font-weight:600;
    padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.12s}
  .tab:hover{background:var(--chip);color:var(--ink)}
  .tab.on{color:#fff}
  .tab.on[data-sup="전체"]{background:var(--navy)}
  .tab.on[data-sup="거래처A"]{background:#2f6fb0}
  .tab.on[data-sup="거래처B"]{background:var(--green)}
  .tab.on[data-sup="거래처C"]{background:var(--amber)}
  .tab.on[data-sup="거래처D"]{background:var(--purple)}
  .tab.on[data-sup="사시미"]{background:var(--sashimi)}
  .spacer{flex:1}
  .counthint{font-size:12.5px;color:var(--sub);white-space:nowrap}

  /* ===== hero ===== */
  .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:0 18px;transition:.2s}
  .hero.search-mode{justify-content:flex-start}
  .logo{margin-top:16vh;font-weight:800;letter-spacing:-2px;font-size:64px;user-select:none;
    transition:.2s;line-height:1}
  .hero.search-mode .logo{margin-top:22px;font-size:34px}
  .logo .c1{color:var(--navy)} .logo .c2{color:var(--red)} .logo .c3{color:var(--amber)}
  .logo .c4{color:var(--green)} .logo .c5{color:var(--purple)}
  .tagline{color:var(--sub);font-size:14px;margin-top:10px}
  .hero.search-mode .tagline{display:none}

  /* ===== search box ===== */
  .searchwrap{width:min(640px,100%);margin-top:26px;position:relative}
  .hero.search-mode .searchwrap{margin-top:18px}
  .searchbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
    border-radius:26px;padding:11px 16px;box-shadow:var(--shadow);background:#fff;transition:.12s}
  .searchbox:focus-within{box-shadow:var(--shadow2);border-color:transparent}
  .searchbox .ic{width:20px;height:20px;flex:0 0 auto;color:var(--sub)}
  #q{flex:1;border:0;outline:0;font-size:17px;background:transparent;color:var(--ink);min-width:0}
  .micbtn,.clearbtn{border:0;background:transparent;cursor:pointer;padding:4px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .micbtn:hover,.clearbtn:hover{background:var(--chip)}
  .micbtn svg{width:22px;height:22px}
  .micbtn.live{color:var(--red);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .clearbtn{color:var(--sub);font-size:18px;width:28px;height:28px}

  .scope{margin-top:9px;font-size:12.5px;color:var(--sub);text-align:center;height:16px}
  .scope b{color:var(--ink)}

  /* example chips */
  .examples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
  .ex{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;
    font-size:13px;color:var(--sub);cursor:pointer;transition:.12s}
  .ex:hover{background:var(--chip);color:var(--ink)}
  .ex.flux{border-color:#f0d9ad;color:var(--flux);background:#fffaf0}

  /* ===== results ===== */
  .results{width:min(820px,100%);margin:8px auto 60px;padding:0 4px}
  .rescount{font-size:13px;color:var(--sub);margin:14px 4px 10px}
  .card{border:1px solid var(--line);border-radius:14px;padding:0;margin-bottom:12px;overflow:hidden;
    background:#fff;transition:.12s}
  .card:hover{box-shadow:var(--shadow)}
  .card .stripe{height:4px;width:100%}
  .stripe.거래처A{background:#2f6fb0} .stripe.거래처B{background:var(--green)}
  .stripe.거래처C{background:var(--amber)} .stripe.거래처D{background:var(--purple)}
  .stripe.사시미{background:var(--sashimi)}
  .cbody{padding:14px 16px 13px}
  .crow1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .cname{font-size:18px;font-weight:700;color:var(--ink);line-height:1.25}
  .supbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap;flex:0 0 auto}
  .supbadge.거래처A{background:#2f6fb0} .supbadge.거래처B{background:var(--green)}
  .supbadge.거래처C{background:var(--amber)} .supbadge.거래처D{background:var(--purple)}
  .supbadge.사시미{background:var(--sashimi)}
  .meta{font-size:12.5px;color:var(--sub);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
  .meta .dot{color:#c8ccd0}
  .priceline{display:flex;align-items:baseline;gap:12px;margin-top:11px;flex-wrap:wrap}
  .price{font-size:27px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
  .perunit{font-size:13px;color:var(--sub);font-weight:600}
  .chg{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .chg.up{background:#fdecea;color:var(--up)} .chg.dn{background:#e8f5ee;color:var(--dn)}
  .chg.flux{background:#fff5e0;color:var(--flux)}
  .vat{margin-top:9px;font-size:12.5px;color:var(--sub);background:#f8f9fa;border-radius:8px;
    padding:7px 11px;line-height:1.5}
  .vat b{color:#3c4043}
  .units{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
  .uchip{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:8px;background:#eef3fb;
    color:#274b78;border:1px solid #dce6f5}
  .uchip .ul{font-weight:600;color:#5f6368;font-size:11px;margin-left:5px}
  .uchip.est{background:#fbf6ee;color:#7a5b12;border-color:#efe1c6}
  /* 사시미 원가 블록 */
  .sashi{margin-top:11px;border:1px solid #cdeaed;background:#f2fbfc;border-radius:12px;padding:12px 13px}
  .sashi .yld{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--sashimi);
    border-radius:999px;padding:3px 10px;margin-bottom:9px}
  .sashi .net{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .sashi .net .big{font-size:24px;font-weight:800;color:#0b5e66;letter-spacing:-.5px}
  .sashi .net .lbl{font-size:12px;color:#3c7980;font-weight:600}
  .sashi .pcs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .sashi .pc{flex:1;min-width:120px;background:#fff;border:1px solid #d3ebee;border-radius:9px;padding:8px 11px}
  .sashi .pc .pn{font-size:18px;font-weight:800;color:#0b5e66}
  .sashi .pc .pl{font-size:11px;color:#5f9aa1;font-weight:600}
  .sashi .rng{font-size:12px;color:#3c7980;line-height:1.6}
  .sashi .rng b{color:#0b5e66}
  .sashi .basis{font-size:11px;color:#6b9aa0;margin-top:7px;line-height:1.5;border-top:1px dashed #cdeaed;padding-top:7px}
  .more{margin-top:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .toggle{font-size:12.5px;color:#1a73e8;cursor:pointer;font-weight:600;user-select:none}
  .src{font-size:11.5px;color:#9aa0a6}
  .hist{margin-top:10px;display:none;border-top:1px dashed var(--line);padding-top:11px}
  .hist.open{display:block}
  .histtitle{font-size:12px;color:var(--sub);margin-bottom:8px;font-weight:600}
  .histtitle .ht2{font-weight:400;color:#9aa0a6;font-size:11px}
  .cause{font-size:12.5px;color:#7a5b12;background:#fffaf0;border:1px solid #f0e2c4;border-radius:8px;
    padding:7px 11px;margin-bottom:10px;line-height:1.5}
  .bars{display:flex;align-items:flex-end;gap:7px;height:74px;padding:2px 0}
  .bar{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
  .bar .b{width:30px;border-radius:4px 4px 0 0;background:#cdd6e6;transition:.2s}
  .bar.cur .b{background:var(--navy)}
  .bar.up .b{background:#e7a6a0} .bar.dn .b{background:#a6d6ba}
  .bar .bp{font-size:10.5px;color:#3c4043;font-weight:700}
  .bar .bd{font-size:9.5px;color:#9aa0a6}
  .raw{font-size:11.5px;color:#9aa0a6;margin-top:9px}
  .raw b{color:#80868b}

  .empty{text-align:center;color:var(--sub);padding:50px 16px;font-size:15px}
  .foot{text-align:center;color:#9aa0a6;font-size:11.5px;padding:18px}
  @media(max-width:520px){
    .logo{font-size:48px;margin-top:12vh}.price{font-size:24px}.cname{font-size:16.5px}
  }
  /* ===== 비밀번호 게이트 ===== */
  #gate{position:fixed;inset:0;z-index:1000;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px;text-align:center}
  #gate.hide{display:none}
  #gate .glogo{font-weight:800;letter-spacing:-2px;font-size:46px;user-select:none}
  #gate .glogo .c1{color:var(--navy)} #gate .glogo .c2{color:var(--red)}
  #gate .glogo .c3{color:var(--amber)} #gate .glogo .c4{color:var(--green)}
  #gate .gsub{color:var(--sub);font-size:13.5px;margin-top:-4px}
  #gate .gbox{display:flex;gap:8px;width:100%;max-width:300px;margin-top:10px}
  #gate input{flex:1;min-width:0;padding:13px 14px;font-size:18px;border:1.5px solid var(--line);
    border-radius:12px;outline:none;text-align:center;letter-spacing:6px;color:var(--ink)}
  #gate input:focus{border-color:var(--navy)}
  #gate button{padding:13px 20px;font-size:15px;font-weight:700;border:none;border-radius:12px;
    background:var(--navy);color:#fff;cursor:pointer;white-space:nowrap}
  #gate button:active{transform:scale(.97)}
  #gate .gerr{color:var(--red);font-size:13px;font-weight:600;height:16px}
  #gate .ghint{color:#9aa0a6;font-size:11.5px;margin-top:2px}
</style>
</head>

        <input id="q" type="text" placeholder="품목 검색 (예: 우동면, 삼겹살, 참치)" autocomplete="off" spellcheck="false">

        </button>
      </div>
      <div class="scope" id="scope"></div>
      <div class="examples" id="examples"></div>
    </div>
  </div>

  <div class="results" id="results"></div>
  <div class="foot">단가는 1단위(개·봉·kg 등)당 가격입니다. 데이터 출처: 발주처 영수증 · 부가세 기준은 발주처별 영수증 표기.</div>

<script>
// ===== 비밀번호 게이트 (클라이언트 측 · 캐주얼 보호) =====
(function(){
  const PW=null; // 데모: 게이트 해제
  const gate=document.getElementById('gate');
  const pw=document.getElementById('gpw');
  const btn=document.getElementById('gbtn');
  const err=document.getElementById('gerr');
  let ok=true; // 데모: 항상 통과
  try{ if(sessionStorage.getItem('dg_ok')==='1') ok=true; }catch(e){}
  if(ok){ gate.classList.add('hide'); }
  else{ setTimeout(()=>pw&&pw.focus(),120); }
  function tryOpen(){
    if(pw.value===PW){
      try{ sessionStorage.setItem('dg_ok','1'); }catch(e){}
      gate.classList.add('hide');
    }else{
      err.textContent='비밀번호가 틀렸어요';
      pw.value='';
      if(gate.querySelector('.gbox').animate){
        gate.querySelector('.gbox').animate(
          [{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],
          {duration:170});
      }
      pw.focus();
    }
  }
  btn.addEventListener('click',tryOpen);
  pw.addEventListener('keydown',e=>{ if(e.key==='Enter') tryOpen(); });
  pw.addEventListener('input',()=>{ err.textContent=''; });

function tokens(s){return s.trim().toLowerCase().split(/\s+/).filter(Boolean);}
function match(item, q){
  if(q==="#변동") return item.changed;
  const tk=tokens(q);
  return tk.every(t=> item.st.includes(t));
}
function score(item,q){
  const n=item.name.toLowerCase(); const first=tokens(q)[0]||"";
  if(n===first) return 0; if(n.startsWith(first)) return 1; if(n.includes(first)) return 2; return 3;
}

function dirLabel(d){ if(d.includes("인상"))return"▲ "+d; if(d.includes("인하"))return"▼ "+d; return"◆ "+d; }

      // 우니류: 1팩 N줄 → 1줄당 단가
      pieceHtml = `<div class="pcs">
        <div class="pc"><div class="pn">${fmt(item.serv_price)}원</div><div class="pl">1${item.serv_unit}당 (1팩 ${item.serv_n}${item.serv_unit})</div></div>
      </div>`;
    } else {
      pieceHtml = `<div class="pcs">
        <div class="pc"><div class="pn">${fmt(item.p18)}원</div><div class="pl">1피스 18g</div></div>
        <div class="pc"><div class="pn">${fmt(item.p20)}원</div><div class="pl">1피스 20g</div></div>
      </div>`;
    }
    sashiHtml = `<div class="sashi">
      <span class="yld">수율 ${item.yld}% 반영</span>
      <div class="net"><span class="big">${fmt(item.net_g)}원/g</span><span class="lbl">순살(가식부) 기준 · 순살 kg당 ${fmt(item.net_kg)}원</span></div>
      ${pieceHtml}
      <div class="rng">원물 단가 변동: <b>${fmt(item.raw_lo)}~${fmt(item.raw_hi)}원</b>/${item.unit} · 현재 ${fmt(item.price)}원 (${item.ndates}일)<br>
        순살 g당 변동: <b>${fmt(item.net_g_lo)}~${fmt(item.net_g_hi)}원/g</b></div>
      <div class="basis">📌 수율 근거: ${item.basis}</div>
    </div>`;
  }
  const toggle = item.hist.length>1 ? `<span class="toggle" onclick="document.getElementById('h_${item.idx}').classList.toggle('open');this.textContent=this.textContent.includes('숨기기')?'가격 이력 보기 ▾':'가격 이력 숨기기 ▴'">가격 이력 보기 ▾</span>`:"";
  const bodyMid = item.sashimi ? sashiHtml : (unitsHtml + `<div class="vat">${vat}</div>`);
  return `<div class="card">
    <div class="stripe ${item.sup}"></div>
    <div class="cbody">
      <div class="crow1"><div class="cname">${item.name}</div><div class="supbadge ${item.sup}">${item.sup}</div></div>
      <div class="meta">${metaParts.map((m,i)=>(i?'<span class="dot">·</span>':'')+m).join(" ")}</div>
      <div class="priceline"><div class="price">₩${fmt(item.price)}</div><div class="perunit">/ ${item.sashimi? (item.unit+' (원물)') : unitTxt}</div>${chg}</div>
      ${bodyMid}
      <div class="more">${toggle}<span class="src">출처 ${item.hist[item.hist.length-1]? '· 최근거래 '+item.hist[item.hist.length-1].d:''}</span></div>
      ${hist}
      <div class="raw">${item.sashimi?'기준':'원본 품목명'}: <b>${item.raw}</b></div>
    </div></div>`;
}

function render(){
  const q=$("#q").value.trim();
  const hero=$("#hero"), res=$("#results"), scopeEl=$("#scope");
  $("#clear").style.display = q? "flex":"none";
  // scope hint
  scopeEl.innerHTML = scope==="전체"
     ? '전체 발주처에서 검색 · <b>부분 검색</b> 지원 (예: "우동" 만 입력해도 검색)'
     : `<b>${scope}</b> 발주처 안에서만 검색 중`;

  if(!q && scope==="전체"){
    hero.classList.remove("search-mode"); res.innerHTML=""; return;
  }
  hero.classList.add("search-mode");
  let list = DATA.filter(d=> (scope==="전체"||d.sup===scope) && (q? match(d,q): true));
  list.forEach((d,i)=>d.idx=i);
  if(q){ list.sort((a,b)=> score(a,q)-score(b,q) || a.sup.localeCompare(b.sup) || a.name.localeCompare(b.name)); }
  if(!list.length){
    res.innerHTML = `<div class="empty">"${q}"에 대한 결과가 없어요.<br>다른 단어로 검색하거나, 위 발주처 칩을 바꿔보세요.</div>`;
    return;
  }
  const head=`<div class="rescount">${list.length}개 품목${scope!=="전체"?` · ${scope}`:""}${q==="#변동"?" · 단가 변동 품목":""}${(!q&&scope==="사시미")?" · 수율 반영 순살 원가":""}</div>`;
  res.innerHTML = head + list.map(card).join("");
}

// input events
$("#q").addEventListener("input", render);
$("#clear").onclick=()=>{$("#q").value="";render();$("#q").focus();};

// ---- voice ----
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=$("#mic");
if(SR){
  const rec=new SR(); rec.lang="ko-KR"; rec.interimResults=true; rec.continuous=false;
  let on=false;
  mic.onclick=()=>{ if(on){rec.stop();return;} try{rec.start();}catch(e){} };
  rec.onstart=()=>{on=true;mic.classList.add("live");$("#q").placeholder="듣고 있어요… 말해보세요";};
  rec.onend=()=>{on=false;mic.classList.remove("live");$("#q").placeholder="품목 검색 (예: 우동면, 삼겹살, 참치)";};
  rec.onerror=()=>{on=false;mic.classList.remove("live");};
  rec.onresult=e=>{
    let t=""; for(const r of e.results) t+=r[0].transcript;
    t=t.replace(/\s+/g,'').trim(); // 한국어는 띄어쓰기 없이도 매칭되게
    $("#q").value=t; render();
  };
}else{
  mic.title="이 브라우저는 음성 검색을 지원하지 않아요"; mic.style.opacity=.35;
  mic.onclick=()=>alert("이 브라우저는 음성 검색(Web Speech API)을 지원하지 않습니다. 크롬/사파리에서 사용하세요.");
}

render();
</script>
</body>
</html>
